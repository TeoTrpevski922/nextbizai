<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextBizAI · Davor Cut</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:22px 32px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}.sub{opacity:.65;font-size:13px;margin-top:3px}
.container{max-width:1200px;margin:28px auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 4px 14px #00000008}
.label{font-size:12px;color:#6b7280}.value{font-size:27px;font-weight:800;margin-top:7px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:20px}
h2{margin:0 0 14px}.day{font-size:14px;color:#6b7280;margin-bottom:14px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{border-radius:10px;padding:13px 15px;border:1px solid #dbe7df;background:#effaf2}
.slot.booked{background:#fff1f2;border-color:#fecdd3}
.time{font-weight:800}.status{font-size:12px;margin-top:4px;color:#4b5563}.booked .status{color:#be123c}
.service{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}
button{border:0;background:#111827;color:white;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:700}
button:hover{opacity:.9}
.form{margin-top:20px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}
.full{grid-column:1/-1}.message{margin-top:10px;font-size:13px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.slots{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><div class="logo">NextBizAI</div><div class="sub">Davor Cut · Live Dashboard</div></div><div id="dbStatus">Connecting...</div></header>
<div class="container">
<div class="stats">
<div class="card"><div class="label">Закажани денес</div><div class="value" id="todayCount">-</div></div>
<div class="card"><div class="label">Слободни слотови</div><div class="value" id="freeCount">-</div></div>
<div class="card"><div class="label">Вкупно клиенти</div><div class="value" id="customerCount">-</div></div>
<div class="card"><div class="label">Работно време</div><div class="value" style="font-size:20px">10:00–20:00</div></div>
</div>

<div class="layout">
<div>
<div class="card">
<h2 id="dateTitle">Распоред</h2><div class="day" id="dateSub"></div>
<div class="slots" id="slots">Loading...</div>
</div>

<div class="card form">
<h2>Нова резервација</h2>
<div class="formgrid">
<input id="customerName" placeholder="Име и презиме">
<select id="serviceSelect"></select>
<input id="bookingDate" type="date">
<select id="bookingTime"></select>
<button class="full" onclick="createBooking()">Зачувај резервација</button>
</div>
<div class="message" id="message"></div>
</div>
</div>

<div class="card">
<h2>Услуги</h2><div id="services">Loading...</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://tddghbnzkytkicrevfkz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_a1rBONP2tfAp-OBDq1IIJA_1CFKU51_';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let businessId = null, services = [], bookings = [];

function todayISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Skopje'});}
function fmtDate(d){return new Intl.DateTimeFormat('mk-MK',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Skopje'}).format(new Date(d+'T12:00:00'));}

async function init(){
 try{
  const {data:b,error:be}=await db.from('businesses').select('*').eq('name','Davor Cut').limit(1).single();
  if(be) throw be;
  businessId=b.id;
  const {data:s,error:se}=await db.from('services').select('*').eq('business_id',businessId).order('price');
  if(se) throw se;
  services=s||[];
  document.getElementById('dbStatus').textContent='● Database connected';
  document.getElementById('dbStatus').style.color='#34d399';
  renderServices(); renderServiceSelect(); setDefaultDate(); await loadCustomers(); await loadBookings();
 }catch(e){
  console.error(e); document.getElementById('dbStatus').textContent='Database error';
  document.getElementById('dbStatus').style.color='#fb7185';
  document.getElementById('slots').innerHTML='<div style="color:#be123c">Не можам да ја прочитам базата. Провери Supabase URL/key и RLS policies.</div>';
 }
}
function setDefaultDate(){
 const d=todayISO(); document.getElementById('bookingDate').value=d;
 const times=[]; for(let h=10;h<20;h++)for(let m of [0,30]){if(h===19&&m===30)times.push('19:30');else times.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}
 document.getElementById('bookingTime').innerHTML=times.map(t=>`<option>${t}</option>`).join('');
}
function renderServices(){
 document.getElementById('services').innerHTML=services.map(s=>`<div class="service"><span>${esc(s.name)}</span><b>${s.price} ден</b></div>`).join('');
}
function renderServiceSelect(){
 document.getElementById('serviceSelect').innerHTML=services.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.price} ден</option>`).join('');
}
async function loadCustomers(){
 const {count,error}=await db.from('customers').select('*',{count:'exact',head:true}).eq('business_id',businessId);
 if(!error) document.getElementById('customerCount').textContent=count??0;
}
async function loadBookings(){
 const date=document.getElementById('bookingDate').value||todayISO();
 const {data,error}=await db.from('bookings').select('*, customers(name), services(name,price)').eq('business_id',businessId).eq('booking_date',date).order('start_time');
 if(error){console.error(error);return}
 bookings=data||[];
 renderSlots(date);
}
function renderSlots(date){
 document.getElementById('dateTitle').textContent='Распоред';
 document.getElementById('dateSub').textContent=fmtDate(date);
 const map={}; bookings.forEach(b=>map[b.start_time.slice(0,5)]=b);
 const arr=[];for(let h=10;h<20;h++)for(let m of [0,30]){
  const t=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); if(map[t]){let b=map[t];arr.push(`<div class="slot booked"><div class="time">${t} · Закажано</div><div class="status">${esc(b.customers?.name||'Клиент')} · ${esc(b.services?.name||'Услуга')} · ${b.services?.price??''} ден</div></div>`)}else arr.push(`<div class="slot"><div class="time">${t} · Слободно</div><div class="status">Достапен термин</div></div>`)
 }
 document.getElementById('slots').innerHTML=arr.join('');
 document.getElementById('freeCount').textContent=arr.length-bookings.length;
 document.getElementById('todayCount').textContent=date===todayISO()?bookings.length:'-';
}
document.getElementById('bookingDate').addEventListener('change',loadBookings);

async function createBooking(){
 const name=document.getElementById('customerName').value.trim();
 const serviceId=document.getElementById('serviceSelect').value;
 const date=document.getElementById('bookingDate').value;
 const time=document.getElementById('bookingTime').value;
 const msg=document.getElementById('message');
 if(!name){msg.textContent='Внеси име и презиме.';return}
 if(bookings.some(b=>b.start_time.slice(0,5)===time)){msg.textContent='Овој термин е веќе зафатен.';return}
 let {data:c,error:ce}=await db.from('customers').select('id').eq('business_id',businessId).eq('name',name).limit(1).maybeSingle();
 if(ce){msg.textContent=ce.message;return}
 if(!c){const r=await db.from('customers').insert({business_id:businessId,name}).select('id').single();if(r.error){msg.textContent=r.error.message;return}c=r.data}
 const service=services.find(s=>s.id===serviceId);
 const end=add30(time);
 const r=await db.from('bookings').insert({business_id:businessId,customer_id:c.id,service_id:serviceId,booking_date:date,start_time:time,end_time:end,status:'confirmed',source:'dashboard'}).select().single();
 if(r.error){msg.textContent='Грешка: '+r.error.message;return}
 msg.textContent='✅ Резервацијата е зачувана.';
 document.getElementById('customerName').value='';
 await loadCustomers(); await loadBookings();
}
function add30(t){let [h,m]=t.split(':').map(Number);m+=30;if(m>=60){h++;m-=60}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
init();
</script>
</body>
</html>
