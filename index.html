<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextBizAI — Davor Cut</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}header{height:64px;background:#111;color:#fff;display:flex;align-items:center;padding:0 28px;font-size:20px;font-weight:700}header span{font-size:13px;font-weight:400;opacity:.65;margin-left:10px}.wrap{max-width:1200px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:18px}.stat b{font-size:26px;display:block;margin-top:8px}.muted{color:#777;font-size:13px}.layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:18px}.day{margin-bottom:15px}h2{margin:0 0 6px}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slot{padding:12px;border:1px solid #ddd;border-radius:10px;background:#f0f8f0}.slot.booked{background:#fff0f0;border-color:#efb0b0}.slot b{display:block;margin-bottom:4px}.slot small{color:#666}.services{display:grid;gap:8px}.service{display:flex;justify-content:space-between;padding:12px;border:1px solid #eee;border-radius:10px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
</style></head><body><header>NextBizAI <span>· Davor Cut Dashboard</span></header><div class="wrap">
<section class="stats"><div class="card stat"><div class="muted">Закажани денес</div><b id="booked">1</b></div><div class="card stat"><div class="muted">Слободни слотови</div><b id="free">19</b></div><div class="card stat"><div class="muted">Нови leads</div><b>0</b></div><div class="card stat"><div class="muted">Работно време</div><b style="font-size:20px">10:00–20:00</b></div></section>
<div class="layout"><main class="card"><div class="day"><h2>📅 Четврток</h2><div class="muted">17.09.2026 · слотови на 30 минути</div></div><div id="slots" class="slots"></div></main>
<aside class="card"><h2>💈 Услуги</h2><div class="muted" style="margin-bottom:14px">Davor Cut</div><div class="services">
<div class="service"><span>Шишање</span><b>400 ден</b></div><div class="service"><span>Шишање + миење</span><b>450 ден</b></div><div class="service"><span>Шишање + брада</span><b>450 ден</b></div><div class="service"><span>Шишање + миење + брада</span><b>500 ден</b></div></div></aside></div></div>
<script>
const slots=[];for(let h=10;h<20;h++){slots.push(String(h).padStart(2,'0')+':00');slots.push(String(h).padStart(2,'0')+':30')}
const bookings={'15:00':{name:'Teo Trpevski',service:'Шишање + брада',price:450}};
function render(){const el=document.getElementById('slots');el.innerHTML='';slots.forEach(t=>{const d=document.createElement('div');d.className='slot '+(bookings[t]?'booked':'');d.innerHTML=bookings[t]?`<b>${t} 🔴 Закажано</b>${bookings[t].name}<br><small>${bookings[t].service} · ${bookings[t].price} ден</small>`:`<b>${t} 🟢 Слободно</b><small>Слободен термин</small>`;el.appendChild(d)});document.getElementById('booked').textContent=Object.keys(bookings).length;document.getElementById('free').textContent=slots.length-Object.keys(bookings).length}render();
</script></body></html>
